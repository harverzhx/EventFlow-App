<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="badgeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AB4FF"/><stop offset="0.5" stop-color="#208AEF"/><stop offset="1" stop-color="#0274DF"/>
    </linearGradient>
    <linearGradient id="flowG" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9E3FF"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1675D4"/><stop offset="1" stop-color="#0274DF"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#3C9FFE"/><stop offset="1" stop-color="#3C9FFE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFFFFF"/>

  <!-- aurora backdrop -->
  <circle cx="70" cy="420" r="190" fill="url(#glowG)" opacity="0.5"/>
  <circle cx="330" cy="160" r="170" fill="url(#glowG)" opacity="0.4"/>
  <circle cx="200" cy="760" r="200" fill="url(#glowG)" opacity="0.5"/>

  <!-- status bar -->
  <text x="24" y="22" font-family="sans-serif" font-size="13" fill="#0B1F3A">9:41</text>
  <circle cx="18" cy="20" r="4" fill="#0B1F3A" opacity="0.85"/>
  <rect x="330" y="16" width="14" height="9" rx="2.5" fill="none" stroke="#0B1F3A" stroke-width="1.4"/>
  <rect x="331.5" y="17.5" width="8" height="6" rx="1" fill="#0B1F3A"/>
  <rect x="348" y="18" width="2" height="5" rx="1" fill="#0B1F3A"/>

  <!-- logo mark (92px) -->
  <g transform="translate(149,40)">
    <circle cx="46" cy="46" r="78" fill="url(#glowG)" opacity="0.6"/>
    <g transform="translate(0,2) scale(0.1797)">
      <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#badgeG)"/>
      <path d="M 170 174 H 318 A 24 24 0 0 1 342 198 V 228 A 24 24 0 0 1 318 252 H 212 A 24 24 0 0 0 188 276 V 306 A 24 24 0 0 0 212 330 H 300" fill="none" stroke="url(#flowG)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="300" cy="330" r="30" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="195" y="178" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="800" letter-spacing="-0.5" fill="#0B1F3A" >Event<tspan fill="#0274DF">Flow</tspan></text>

  <!-- title -->
  <text x="195" y="230" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0B1F3A">Welcome back</text>
  <text x="195" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5A6B82">Sign in to continue to your EventFlow dashboard.</text>

  <!-- glass card -->
  <rect x="24" y="300" width="342" height="380" rx="20" fill="#FFFFFF" opacity="0.85"/>
  <rect x="24" y="300" width="342" height="380" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/>

  <!-- email field -->
  <text x="48" y="338" font-family="sans-serif" font-size="14" font-weight="600" fill="#12233D">Email / Username</text>
  <rect x="48" y="352" width="294" height="56" rx="14" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/>
  <path d="M 72 378 h 0 l 8 -5 l 8 5 M 72 374 c -2 0 -3.5 1.5 -3.5 3.5 v 6 c 0 2 1.5 3.5 3.5 3.5 h 13 c 2 0 3.5 -1.5 3.5 -3.5 v -6 c 0 -2 -1.5 -3.5 -3.5 -3.5 z" fill="none" stroke="#5A6B82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="381" font-family="sans-serif" font-size="16" fill="#5A6B82">you@example.com</text>

  <!-- password field -->
  <text x="48" y="446" font-family="sans-serif" font-size="14" font-weight="600" fill="#12233D">Password</text>
  <rect x="48" y="460" width="294" height="56" rx="14" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/>
  <rect x="71" y="479" width="16" height="13" rx="4" fill="none" stroke="#5A6B82" stroke-width="1.6"/>
  <path d="M 79 471 v 6" stroke="#5A6B82" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="79" cy="486" r="2" fill="#5A6B82"/>
  <circle cx="79" cy="486" r="8" fill="none" stroke="#5A6B82" stroke-width="1.6"/>
  <text x="104" y="489" font-family="sans-serif" font-size="16" fill="#5A6B82">Enter your password</text>
  <!-- eye toggle -->
  <path d="M 308 484 c -4 -5 -9 -7 -14 -7 c -5 0 -10 2 -14 7 c 4 5 9 7 14 7 c 5 0 10 -2 14 -7 z M 294 484 a 2 2 0 1 0 0 0.1" fill="none" stroke="#5A6B82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- forgot link -->
  <text x="306" y="556" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="600" fill="#0274DF">Forgot password?</text>

  <!-- login button -->
  <rect x="48" y="574" width="294" height="56" rx="14" fill="url(#btnG)"/>
  <rect x="48" y="574" width="294" height="56" rx="14" fill="none" stroke="#0274DF" stroke-width="1"/>
  <text x="186" y="607" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Login</text>
  <path d="M 186 597 v 12 M 182 601 l 4 -4 l 4 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- footer -->
  <text x="156" y="806" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5A6B82">Don&#8217;t have an account?</text>
  <text x="222" y="806" font-family="sans-serif" font-size="14" font-weight="700" fill="#0274DF">Sign Up</text>
</svg>